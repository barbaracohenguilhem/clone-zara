<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { font-size: 14px; margin: 0 0 2px; }
    .domain {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 14px;
      word-break: break-all;
    }
    .row { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { flex: 1; }
    .value {
      min-width: 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .status {
      margin-top: 12px;
      font-size: 11px;
      opacity: 0.6;
      min-height: 14px;
    }
    .reset {
      margin-top: 12px;
      background: none;
      border: none;
      color: #3b82f6;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
    }
    .reset:hover { text-decoration: underline; }
    .blocked { opacity: 0.6; }
  </style>
</head>
<body>
  <h1>Quiet Tab</h1>
  <div class="domain" id="domain">…</div>

  <div class="row">
    <input type="range" id="slider" min="0" max="100" value="100" step="1" />
    <span class="value" id="value">100%</span>
  </div>

  <div class="status" id="status"></div>
  <button class="reset" id="reset">Reset this site to 100%</button>

  <script src="popup.js"></script>
</body>
</html>
